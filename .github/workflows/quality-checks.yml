name: ERP 자동 검사

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 저장·보안·동기화·UI 회귀 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 받기
        uses: actions/checkout@v6
      - name: Node.js 준비
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: 고정된 의존성 설치
        run: npm ci
      - name: 한글 화면검사 글꼴 준비
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            --output "$HOME/.local/share/fonts/NotoSansKR.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf"
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match "Noto Sans KR"
      - name: 전체 자동 검사
        run: npm run check
      - name: Playwright UI 화면 검사
        run: npm run test:ui-layout
        env:
          UI_SCREENSHOT_DIR: artifacts/ui-v12.5.0
      - name: UI 검사 스크린샷 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-layout-screenshots-${{ github.run_attempt }}
          path: artifacts/ui-v12.5.0
          if-no-files-found: warn
          retention-days: 14
